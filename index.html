<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Live Subtitles</title>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #000;
  --text: #fff;
  --panel-bg: rgba(20, 20, 20, 0.97);
  --panel-border: rgba(255,255,255,0.08);
  --btn-bg: rgba(255,255,255,0.1);
  --btn-hover: rgba(255,255,255,0.18);
  --btn-active-bg: #fff;
  --btn-active-text: #000;
  --name-bg: rgba(255,255,255,0.12);
  --name-hover: rgba(255,255,255,0.22);
  --history-text: rgba(255,255,255,0.35);
  --accent: #4fc3f7;
  --danger: #ef5350;
  --input-bg: rgba(255,255,255,0.07);
  --input-border: rgba(255,255,255,0.15);
}

body.light {
  --bg: #f4f4f0;
  --text: #111;
  --panel-bg: rgba(245,245,240,0.98);
  --panel-border: rgba(0,0,0,0.1);
  --btn-bg: rgba(0,0,0,0.07);
  --btn-hover: rgba(0,0,0,0.13);
  --btn-active-bg: #111;
  --btn-active-text: #fff;
  --name-bg: rgba(0,0,0,0.07);
  --name-hover: rgba(0,0,0,0.14);
  --history-text: rgba(0,0,0,0.3);
  --accent: #0277bd;
  --danger: #c62828;
  --input-bg: rgba(0,0,0,0.05);
  --input-border: rgba(0,0,0,0.15);
}

html, body {
  width: 100%; height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Atkinson Hyperlegible', sans-serif;
  overflow: hidden;
  transition: background 0.3s, color 0.3s;
  touch-action: manipulation;
}

/* ── MAIN DISPLAY ── */
#display {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 24px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}

#history {
  width: 100%;
  text-align: center;
  margin-bottom: 16px;
  min-height: 60px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  justify-content: flex-end;
}

.history-line {
  color: var(--history-text);
  font-size: 4.5vw;
  line-height: 1.3;
  transition: color 0.3s;
  font-weight: 400;
}

#live-word {
  color: var(--text);
  font-weight: 700;
  text-align: center;
  line-height: 1.1;
  transition: font-size 0.15s ease, color 0.3s;
  word-break: break-word;
  width: 100%;
  min-height: 15vw;
}

/* ── PANEL OVERLAY ── */
#panel-overlay {
  position: fixed;
  inset: 0;
  background: transparent;
  z-index: 10;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s ease;
}

#panel-overlay.visible {
  opacity: 1;
  pointer-events: all;
}

/* ── PANEL ── */
#panel {
  position: fixed;
  bottom: 0;
  left: 0; right: 0;
  background: var(--panel-bg);
  border-top: 1px solid var(--panel-border);
  border-radius: 20px 20px 0 0;
  padding: 20px 20px 32px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), background 0.3s;
  max-height: 70vh;
  overflow-y: auto;
  z-index: 11;
}

#panel-overlay.visible #panel {
  transform: translateY(0);
}

/* Drag handle */
.drag-handle {
  width: 40px; height: 4px;
  background: var(--panel-border);
  border-radius: 2px;
  margin: 0 auto 18px;
}

/* ── PANEL SECTIONS ── */
.panel-section {
  margin-bottom: 18px;
}

.panel-label {
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--history-text);
  margin-bottom: 10px;
  font-weight: 700;
}

/* ── BUTTONS ROW ── */
.btn-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.icon-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  background: var(--btn-bg);
  border: 1px solid var(--panel-border);
  border-radius: 12px;
  color: var(--text);
  font-family: 'Atkinson Hyperlegible', sans-serif;
  font-size: 15px;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  white-space: nowrap;
}

.icon-btn:active { transform: scale(0.95); }
.icon-btn:hover  { background: var(--btn-hover); }

.icon-btn.active {
  background: var(--btn-active-bg);
  color: var(--btn-active-text);
  border-color: transparent;
}

/* ── NAME BUTTONS ── */
#name-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 10px;
}

.name-btn {
  padding: 10px 18px;
  background: var(--name-bg);
  border: 1px solid var(--panel-border);
  border-radius: 50px;
  color: var(--text);
  font-family: 'Atkinson Hyperlegible', sans-serif;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}

.name-btn:active  { transform: scale(0.93); }
.name-btn:hover   { background: var(--name-hover); }

.name-btn .del {
  margin-left: 6px;
  opacity: 0.4;
  font-size: 13px;
}

/* ── NAME ROWS (name + learn + delete) ── */
.name-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.name-row .name-btn { flex: 1; text-align: left; }
.name-learn, .name-del {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid var(--panel-border);
  background: var(--name-bg);
  color: var(--text);
  font-size: 16px;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  flex: 0 0 auto;
}
.name-learn:active, .name-del:active { transform: scale(0.9); }
.name-learn:hover  { background: var(--name-hover); }
.name-del:hover    { background: #e5393533; border-color: #e53935; }
.name-hint {
  margin-top: 10px;
  font-size: 13px;
  opacity: 0.6;
  line-height: 1.4;
}

/* ── ADD NAME ── */
.add-name-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.add-name-row input {
  flex: 1;
  padding: 10px 14px;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 12px;
  color: var(--text);
  font-family: 'Atkinson Hyperlegible', sans-serif;
  font-size: 15px;
  outline: none;
}

.add-name-row input::placeholder { opacity: 0.4; }

.add-name-row button {
  padding: 10px 16px;
  background: var(--accent);
  border: none;
  border-radius: 12px;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
}

.add-name-row button:active { transform: scale(0.93); opacity: 0.8; }

/* ── COUNTDOWN BAR ── */
#countdown-bar {
  position: fixed;
  bottom: 0; left: 0;
  height: 3px;
  background: var(--accent);
  width: 0%;
  transition: none;
  z-index: 20;
  opacity: 0;
}

/* ── LANG INDICATOR ── */
#lang-indicator {
  position: fixed;
  top: 16px; right: 16px;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--history-text);
  text-transform: uppercase;
  pointer-events: none;
  transition: color 0.3s;
}
</style>
</head>
<body>

<div id="lang-indicator">SV</div>

<!-- MAIN -->
<div id="display">
  <div id="history"></div>
  <div id="live-word">Tryck för att börja</div>
</div>

<!-- PANEL OVERLAY (tap anywhere to dismiss) -->
<div id="panel-overlay" onclick="handleOverlayClick(event)">
  <div id="panel" onclick="event.stopPropagation()">
    <div class="drag-handle"></div>

    <!-- SETTINGS -->
    <div class="panel-section">
      <div class="panel-label">Inställningar</div>
      <div class="btn-row">

        <button class="icon-btn" id="mode-btn" onclick="toggleMode()">
          <span id="mode-icon">☀️</span>
          <span id="mode-label">Ljust läge</span>
        </button>

        <button class="icon-btn" id="lang-btn" onclick="toggleLang()">
          <span>🌐</span>
          <span id="lang-label">English</span>
        </button>

        <button class="icon-btn" onclick="clearHistory()">
          <span>🗑</span>
          <span>Rensa historik</span>
        </button>

      </div>
    </div>

    <!-- NAMES -->
    <div class="panel-section">
      <div class="panel-label">Namn – tryck för att visa på skärmen</div>
      <div id="name-buttons"></div>
      <div class="add-name-row">
        <input id="name-input" placeholder="Lägg till namn..." maxlength="30"
          onkeydown="if(event.key==='Enter') addName()">
        <button onclick="addName()">＋</button>
      </div>
      <div class="name-hint">Tips: tryck 🎤 vid ett namn och säg det ett par gånger, så lär sig verktyget hur just din röst låter. ✓ visar att ett namn är inlärt.</div>
    </div>

  </div>
</div>

<!-- COUNTDOWN BAR -->
<div id="countdown-bar"></div>

<script>
/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let isDark      = true;
let currentLang = "sv-SE";
let sentence    = [];
let historyLines = [];
let panelOpen   = false;
let panelTimer  = null;
let countdownAnim = null;
let started     = false;   // har användaren startat mikrofonen?
let learningName = null;   // namn som just nu lärs in via rösten
let learnCaptures = [];    // det motorn hört under inlärning
const PANEL_DURATION = 5000; // ms

// Namnlagring: { display, variants:[], learned:[] }  (learned = riktiga uttal från din röst)
let names = JSON.parse(localStorage.getItem("subtitle_names") || "[]");
names = names.map(n => ({ display: n.display, variants: n.variants || [], learned: n.learned || [] }));

/* ══════════════════════════════════════════
   ELEMENTS
══════════════════════════════════════════ */
const liveWord      = document.getElementById("live-word");
const historyEl     = document.getElementById("history");
const panelOverlay  = document.getElementById("panel-overlay");
const modeBtn       = document.getElementById("mode-btn");
const modeIcon      = document.getElementById("mode-icon");
const modeLabel     = document.getElementById("mode-label");
const langBtn       = document.getElementById("lang-btn");
const langLabel     = document.getElementById("lang-label");
const langIndicator = document.getElementById("lang-indicator");
const nameInput     = document.getElementById("name-input");
const nameButtons   = document.getElementById("name-buttons");
const countdownBar  = document.getElementById("countdown-bar");

/* ══════════════════════════════════════════
   PANEL
══════════════════════════════════════════ */
document.getElementById("display").addEventListener("click", () => {
  if (!started) { startListening(); return; }        // första trycket startar mikrofonen
  if (learningName) { saveLearning(); return; }      // under inlärning: tryck sparar
  if (!panelOpen) openPanel();                        // annars öppnar tryck inställningarna
});

function openPanel() {
  panelOpen = true;
  panelOverlay.classList.add("visible");
  startCountdown();
}

function closePanel() {
  panelOpen = false;
  panelOverlay.classList.remove("visible");
  stopCountdown();
}

function handleOverlayClick(e) {
  if (e.target === panelOverlay) closePanel();
}

function startCountdown() {
  stopCountdown();
  countdownBar.style.transition = "none";
  countdownBar.style.width = "100%";
  countdownBar.style.opacity = "1";

  // Force reflow
  countdownBar.getBoundingClientRect();

  countdownBar.style.transition = `width ${PANEL_DURATION}ms linear`;
  countdownBar.style.width = "0%";

  panelTimer = setTimeout(() => {
    closePanel();
    countdownBar.style.opacity = "0";
  }, PANEL_DURATION);
}

function stopCountdown() {
  clearTimeout(panelTimer);
  countdownBar.style.transition = "none";
  countdownBar.style.width = "0%";
  countdownBar.style.opacity = "0";
}

// Reset timer when user interacts with panel
document.getElementById("panel").addEventListener("click", () => {
  startCountdown();
});

/* ══════════════════════════════════════════
   MODE
══════════════════════════════════════════ */
function toggleMode() {
  isDark = !isDark;
  document.body.classList.toggle("light", !isDark);
  modeIcon.textContent  = isDark ? "☀️" : "🌙";
  modeLabel.textContent = isDark ? "Ljust läge" : "Mörkt läge";
  startCountdown();
}

/* ══════════════════════════════════════════
   LANGUAGE
══════════════════════════════════════════ */
function toggleLang() {
  currentLang = currentLang === "sv-SE" ? "en-US" : "sv-SE";
  const isSv = currentLang === "sv-SE";

  langLabel.textContent     = isSv ? "English" : "Svenska";
  langIndicator.textContent = isSv ? "SV" : "EN";

  // Update UI strings
  document.getElementById("name-input").placeholder =
    isSv ? "Lägg till namn..." : "Add name...";
  document.querySelector(".panel-label").textContent =
    isSv ? "Inställningar" : "Settings";

  restartRecognition();
  startCountdown();
}

/* ══════════════════════════════════════════
   NAMES
══════════════════════════════════════════ */
function saveNames() {
  localStorage.setItem("subtitle_names", JSON.stringify(names));
}

function addName() {
  const raw = nameInput.value.trim();
  if (!raw) return;

  // Capitalize first letter
  const display = raw.charAt(0).toUpperCase() + raw.slice(1);

  // Avoid duplicates
  if (names.find(n => n.display.toLowerCase() === display.toLowerCase())) {
    nameInput.value = "";
    return;
  }

  names.push({ display, variants: generateVariants(display), learned: [] });
  saveNames();
  renderNames();
  nameInput.value = "";
  startCountdown();
}

/* ── LÄR IN UTTAL (fånga hur din röst låter för motorn) ── */
function startLearning(display) {
  if (!SpeechRecognition) { showUnsupported(); return; }
  if (!started) startListening();
  learningName = display;
  learnCaptures = [];
  closePanel();
  showLearnStatus();
}

function showLearnStatus() {
  const heard = learnCaptures.length ? learnCaptures[learnCaptures.length - 1] : "…";
  setBigText('Säg "' + learningName + '" ett par gånger  ·  hört: ' + heard +
             '  ·  tryck för att spara (' + learnCaptures.length + ')', "3.5vw");
}

function saveLearning() {
  const n = names.find(x => x.display === learningName);
  let added = 0;
  if (n) {
    learnCaptures.forEach(cap => {
      const joined = normPhrase(cap);                 // hela frasen utan mellanslag
      if (joined.length >= 2 && !n.learned.includes(joined)) { n.learned.push(joined); added++; }
      cap.trim().split(/\s+/).forEach(part => {        // även varje delord
        const p = normPhrase(part);
        if (p.length >= 3 && !n.learned.includes(p)) { n.learned.push(p); added++; }
      });
    });
    saveNames();
    renderNames();
  }
  const name = learningName;
  learningName = null;
  learnCaptures = [];
  setBigText(added ? '"' + name + '" inlärt! (' + added + ' uttal sparade)'
                   : "Inget hördes – tryck 🎤 och försök igen", "7vw");
}

function removeName(display) {
  names = names.filter(n => n.display !== display);
  saveNames();
  renderNames();
  startCountdown();
}

function showName(display) {
  liveWord.textContent  = display;
  liveWord.style.fontSize = display.length <= 6 ? "20vw" : display.length <= 10 ? "15vw" : "11vw";
  closePanel();
}

function renderNames() {
  nameButtons.innerHTML = "";
  names.forEach(n => {
    const row = document.createElement("div");
    row.className = "name-row";

    const btn = document.createElement("button");
    btn.className = "name-btn";
    btn.textContent = n.display + (n.learned && n.learned.length ? " ✓" : "");
    btn.onclick = () => showName(n.display);

    const learn = document.createElement("button");
    learn.className = "name-learn";
    learn.textContent = "🎤";
    learn.title = "Lär in uttal";
    learn.onclick = (e) => { e.stopPropagation(); startLearning(n.display); };

    const del = document.createElement("button");
    del.className = "name-del";
    del.textContent = "✕";
    del.title = "Ta bort";
    del.onclick = (e) => { e.stopPropagation(); removeName(n.display); };

    row.append(btn, learn, del);
    nameButtons.appendChild(row);
  });
}

// Generate phonetic variants for a name
function generateVariants(name) {
  const base = name.toLowerCase().trim();
  const set = new Set([base]);

  // Fonetiska alternativ (svensk röstmotor hör utländska namn annorlunda)
  const maps = [
    [/ee/g,"i"],[/oo/g,"u"],[/aa/g,"a"],[/ph/g,"f"],
    [/ck/g,"k"],[/sch/g,"sh"],[/tch/g,"ch"],[/qu/g,"kv"],
    [/aj/g,"ai"],[/ej/g,"ei"],[/j/g,"y"],[/w/g,"v"],
    [/c/g,"k"],[/x/g,"ks"],[/z/g,"s"],[/th/g,"t"],
    [/ea/g,"i"],[/ou/g,"u"],[/dt/g,"t"]
  ];
  let simplified = base;
  maps.forEach(([from,to]) => { simplified = simplified.replace(from, to); });
  set.add(simplified);

  // Vanliga uttalsvarianter
  set.add(base.replace(/[aeiouåäö]$/, ""));       // utan slutvokal
  set.add(base.replace(/(.)\1/g, "$1"));          // utan dubbelbokstäver
  set.add(simplify(base));                         // grov fonetisk reduktion

  return [...set].filter(Boolean);
}

/* ══════════════════════════════════════════
   HISTORY
══════════════════════════════════════════ */
function addToHistory(text) {
  if (!text.trim()) return;
  historyLines.push(text);
  if (historyLines.length > 3) historyLines.shift();
  renderHistory();
}

function renderHistory() {
  historyEl.innerHTML = historyLines
    .map(l => `<div class="history-line">${l}</div>`)
    .join("");
}

function clearHistory() {
  historyLines = [];
  renderHistory();
  startCountdown();
}

/* ══════════════════════════════════════════
   SPEECH RECOGNITION
══════════════════════════════════════════ */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let pauseTimer  = null;
const PAUSE_LIMIT = 220;

// iPhone/iPad – används bara för att ge ett hjälpsammare meddelande, INTE för att blockera
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

function setBigText(text, vw) {
  liveWord.textContent = text;
  liveWord.style.fontSize = vw || "7vw";
}

// Visas ENDAST om röstigenkänning faktiskt saknas i webbläsaren
function showUnsupported() {
  const sv = currentLang === "sv-SE";
  if (isIOS) {
    setBigText(sv
      ? "Öppna länken i Safari på din iPhone (kräver iOS 14.5 eller senare). Andra webbläsare på iPhone stöder tyvärr inte röstigenkänning."
      : "Open the link in Safari on your iPhone (needs iOS 14.5+). Other iPhone browsers don't support speech recognition.",
      "4.5vw");
  } else {
    setBigText(sv
      ? "Den här webbläsaren stöder inte röstigenkänning. Prova Chrome, Edge eller Safari."
      : "This browser doesn't support speech recognition. Try Chrome, Edge or Safari.",
      "5vw");
  }
}

// Startar mikrofonen – MÅSTE ske efter ett tryck (krav på mobil)
function startListening() {
  if (!SpeechRecognition) { showUnsupported(); return; }
  started = true;
  buildRecognition();
  try { recognition.start(); } catch (e) {}
  setBigText(currentLang === "sv-SE" ? "Lyssnar..." : "Listening...", "8vw");
}

function buildRecognition() {
  if (recognition) {
    try { recognition.onend = null; recognition.stop(); } catch(e) {}
  }

  recognition = new SpeechRecognition();
  recognition.lang = currentLang;
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onresult = handleResult;
  // Håll igång lyssningen (mobil-Chrome avslutar ofta av sig själv)
  recognition.onend = () => { if (started) { try { recognition.start(); } catch(e) {} } };
  recognition.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      // Mikrofon nekad – sluta loopa och be användaren tillåta + trycka igen
      started = false;
      const sv = currentLang === "sv-SE";
      setBigText(sv ? "Tillåt mikrofonen och tryck för att börja"
                    : "Allow the microphone, then tap to start", "5vw");
    } else if (e.error !== "aborted" && e.error !== "no-speech") {
      if (started) setTimeout(restartRecognition, 500);
    }
  };
}

function restartRecognition() {
  if (!started) return;
  buildRecognition();
  try { recognition.start(); } catch(e) {}
  setBigText(currentLang === "sv-SE" ? "Lyssnar..." : "Listening...", "8vw");
}

/* ══════════════════════════════════════════
   NAME MATCHING
══════════════════════════════════════════ */
function simplify(word) {
  return word
    .toLowerCase()
    .replace(/ee/g,"i").replace(/oo/g,"o").replace(/aa/g,"a")
    .replace(/ph/g,"f").replace(/b/g,"p").replace(/d/g,"t")
    .replace(/g/g,"k").replace(/z/g,"s")
    .replace(/[^a-zåäö]/g,"");
}

// Redigeringsavstånd (Levenshtein) – robust jämförelse
function editDistance(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}

function similarity(a, b) {
  a = simplify(a); b = simplify(b);
  if (!a.length && !b.length) return 1;
  if (!a.length || !b.length) return 0;
  return 1 - editDistance(a, b) / Math.max(a.length, b.length);
}

function normPhrase(s) {
  return (s || "").toLowerCase().replace(/[^a-zåäö]/g, "");
}

function findNameMatch(chunk) {
  const w = normPhrase(chunk);
  if (w.length < 2) return null;

  // 1) Exakt mot inlärda uttal (från din röst) eller stavningsvarianter
  for (const n of names) {
    if (n.learned.some(l => normPhrase(l) === w)) return n.display;
    if (n.variants.some(v => normPhrase(v) === w)) return n.display;
    if (normPhrase(n.display) === w) return n.display;
  }

  // 2) Konservativ luddig matchning (hög tröskel -> stör inte vanliga ord)
  let best = null, bestScore = 0.82;
  for (const n of names) {
    for (const v of [...n.learned, ...n.variants, n.display]) {
      const s = similarity(w, normPhrase(v));
      if (s > bestScore) { bestScore = s; best = n.display; }
    }
  }
  return best;
}

// Matcha namn även när röstmotorn delat upp det i flera ord ("de pack" -> "Deepak")
function applyNames(words) {
  const out = [];
  let i = 0;
  while (i < words.length) {
    let matched = null, span = 1;
    const maxSpan = Math.min(4, words.length - i);
    for (let w = maxSpan; w >= 1; w--) {
      const chunk = words.slice(i, i + w).join("");
      const m = findNameMatch(chunk);
      if (m) { matched = m; span = w; break; }
    }
    if (matched) { out.push(matched); i += span; }
    else { out.push(words[i]); i++; }
  }
  return out;
}

/* ══════════════════════════════════════════
   NORMALIZATION
══════════════════════════════════════════ */
const FILLER_WORDS = new Set(["öh","eh","hmm","uhm","uh","eeh","ahh","mm"]);

function normalizeWord(w) {
  w = w.toLowerCase().trim();
  if (FILLER_WORDS.has(w)) return null;

  // Skiljetecken-kommandon
  const punct = {
    "punkt":".", "frågetecken":"?", "komma":",",
    "utropstecken":"!", "ellips":"...",
    "period":".", "question mark":"?", "exclamation":"!"
  };
  if (punct[w]) return punct[w];

  // Namn hanteras i applyNames (över flera ord) – inte här
  return w;
}

function mergeLetters(words) {
  if (words.length < 2) return words;
  if (words.every(w => w.length === 1)) return [words.join("")];
  return words;
}

/* ══════════════════════════════════════════
   RESULT HANDLER
══════════════════════════════════════════ */
function handleResult(event) {
  // Inlärningsläge: fånga vad motorn hör i stället för att bygga meningar
  if (learningName) {
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const res = event.results[i];
      if (res.isFinal) {
        const t = res[0].transcript.trim();
        if (t) learnCaptures.push(t);
      }
    }
    showLearnStatus();
    return;
  }

  resetPauseTimer();

  for (let i = event.resultIndex; i < event.results.length; i++) {
    const result     = event.results[i];
    const transcript = result[0].transcript.toLowerCase().trim();
    if (!transcript) continue;

    let words = transcript.split(" ").filter(Boolean);
    words = mergeLetters(words);

    // Live: visa de sista ett–två orden som rullar fram (namn slås ihop)
    const tail     = applyNames(words);
    const liveText = tail.slice(-2).join(" ");   // upp till två sista orden

    liveWord.textContent = liveText;

    const len = liveText.length;
    let size;
    if ([".", "?", "!", "..."].includes(liveText)) size = "22vw";
    else if (len <= 4)   size = "20vw";
    else if (len <= 8)   size = "16vw";
    else if (len <= 12)  size = "13vw";
    else if (len <= 18)  size = "10vw";
    else                 size = "8vw";
    liveWord.style.fontSize = size;

    // Bygg meningen när delen är klar
    if (result.isFinal) {
      // Ta bort fillerord och översätt skiljetecken-kommandon först
      let clean = [];
      words.forEach(w => {
        const n = normalizeWord(w);
        if (n) clean.push(n);
      });
      // Slå sedan ihop ev. namn som delats i flera ord
      applyNames(clean).forEach(w => sentence.push(w));
    }
  }
}

/* ══════════════════════════════════════════
   PAUSE → BUILD SENTENCE
══════════════════════════════════════════ */
function resetPauseTimer() {
  clearTimeout(pauseTimer);
  pauseTimer = setTimeout(handlePause, PAUSE_LIMIT);
}

function handlePause() {
  if (sentence.length === 0) return;

  let text = sentence.join(" ")
    .replace(/ \./g,".").replace(/ ,/g,",")
    .replace(/ \?/g,"?").replace(/ !/g,"!")
    .replace(/ \.\.\./g,"...");

  // Automatisk punktuation (om inget röstkommando redan satt det)
  text = autoPunctuate(text);

  // Capitalize first letter
  text = text.charAt(0).toUpperCase() + text.slice(1);

  liveWord.textContent  = text;
  liveWord.style.fontSize = text.length < 20 ? "8vw" : text.length < 40 ? "6vw" : "4.5vw";

  addToHistory(text);
  sentence = [];
}

/* ══════════════════════════════════════════
   AUTO-PUNKTUATION (heuristik)
══════════════════════════════════════════ */
// Ord som ofta inleder en fråga -> sätter frågetecken
const SV_QUESTION = new Set([
  "vad","vem","vems","vilken","vilket","vilka","var","vart","varifrån","varför",
  "när","hur","hurdan","är","har","hade","kan","kunde","ska","skall","skulle",
  "vill","ville","får","fick","gör","gjorde","kommer","blir","blev","finns",
  "behöver","måste","tror","vet","heter","bor","orkar","törs","vågar","undrar"
]);
const EN_QUESTION = new Set([
  "what","who","whom","whose","which","where","when","why","how",
  "do","does","did","is","are","am","was","were","can","could","will",
  "would","shall","should","may","might","must","have","has","had"
]);

function autoPunctuate(text) {
  const t = text.trim();
  if (!t) return t;
  if (/[.?!…]$/.test(t)) return t;               // redan satt via röstkommando
  const first = t.split(/\s+/)[0].toLowerCase().replace(/[^a-zåäöa-z']/g, "");
  const set = (currentLang === "sv-SE") ? SV_QUESTION : EN_QUESTION;
  return t + (set.has(first) ? "?" : ".");
}

/* ══════════════════════════════════════════
   INIT
══════════════════════════════════════════ */
// Behåll inlärda uttal, uppdatera bara stavningsvarianterna
names = names.map(n => ({ display: n.display, variants: generateVariants(n.display), learned: n.learned || [] }));
saveNames();

renderNames();

// Starta INTE automatiskt – mobilen kräver ett tryck. Visa rätt startläge.
if (!SpeechRecognition) {
  showUnsupported();
} else {
  setBigText(currentLang === "sv-SE" ? "Tryck för att börja" : "Tap to start", "9vw");
}
